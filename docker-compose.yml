services:
  api:
    build: .
    image: rayquaza-fleet:local
    command:
      - /bin/sh
      - -c
      - >-
        mkdir -p /state/data /state/reports &&
        cp -rn /opt/seed-data/. /state/data/ &&
        python -m src.pipeline &&
        exec uvicorn src.api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - fleet-state:/state
      - type: bind
        source: ./models
        target: /app/models
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=10)"]
      interval: 15s
      timeout: 15s
      retries: 5
      start_period: 60s

  ui:
    build: .
    image: rayquaza-fleet:local
    command: ["streamlit", "run", "ui/app.py", "--server.address", "0.0.0.0", "--server.port", "8501", "--server.headless", "true"]
    ports:
      - "8501:8501"
    environment:
      API_URL: http://api:8000
    volumes:
      - fleet-state:/state
      - type: bind
        source: ./models
        target: /app/models
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5

volumes:
  fleet-state:
